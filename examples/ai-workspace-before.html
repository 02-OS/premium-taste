<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DraftBench AI — Before</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0b0d14;
      color: #f8fafc;
      min-height: 100vh;
    }
    .app {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 100vh;
    }
    aside {
      background: #111424;
      border-right: 1px solid #232744;
      padding: 20px;
    }
    .brand {
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 24px;
      color: #e2e8f0;
    }
    .upgrade-box {
      margin-top: 24px;
      padding: 16px;
      border-radius: 16px;
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      box-shadow: 0 12px 30px rgba(99, 102, 241, 0.35);
    }
    main { padding: 32px; }
    .hero-head {
      text-align: center;
      margin-bottom: 28px;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.18);
      color: #a5b4fc;
      font-size: 12px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 40px;
      font-weight: 700;
      background: linear-gradient(90deg, #fff, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background: #16192b;
      border: 1px solid #262b47;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    }
    .prompt-box {
      background: #16192b;
      border: 1px solid #313863;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.4);
    }
    textarea {
      width: 100%;
      min-height: 120px;
      background: #0b0d14;
      color: #f8fafc;
      border: 1px solid #2a3052;
      border-radius: 12px;
      padding: 12px;
      outline: none;
      margin-bottom: 14px;
    }
    .actions { display: flex; gap: 12px; }
    .btn-primary {
      background: #4f46e5;
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 11px 18px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">✨ DraftBench AI</div>
      <p style="font-size:13px;color:#94a3b8;">Trusted by 10,000+ AI teams</p>
      <div class="upgrade-box">
        <p style="font-size:13px;font-weight:600;">Unlock Pro Magic</p>
        <p style="font-size:12px;margin:6px 0 12px;">Seamless next-gen generation.</p>
        <button class="btn-primary" type="button">Upgrade Now</button>
      </div>
    </aside>
    <main>
      <div class="hero-head">
        <span class="badge">✨ Powered by next-gen agents</span>
        <h1>Supercharge your writing workflow</h1>
        <p style="color:#94a3b8;margin-top:8px;">Elevate your docs with effortless AI speed.</p>
      </div>
      <div class="kpi-grid">
        <div class="card"><div>Speed Boost</div><strong>4.8x</strong></div>
        <div class="card"><div>Accuracy</div><strong>99.4%</strong></div>
        <div class="card"><div>Prompts Run</div><strong>1.2M+</strong></div>
        <div class="card"><div>Hours Saved</div><strong>420</strong></div>
      </div>
      <div class="prompt-box">
        <textarea placeholder="Ask AI anything..."></textarea>
        <div class="actions">
          <button class="btn-primary" type="button">✨ Generate Magic</button>
          <button class="btn-primary" type="button">Compare Drafts</button>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
