<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kestrel CLI — Before</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      color: #0f172a;
    }
    header {
      display: flex;
      justify-content: space-between;
      padding: 20px 40px;
      border-bottom: 1px solid #e2e8f0;
    }
    .hero {
      text-align: center;
      padding: 80px 24px 56px;
      background: radial-gradient(circle at top, #eef2ff, #ffffff 65%);
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 50px;
      background: linear-gradient(90deg, #4f46e5, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    .cta-group { display: flex; justify-content: center; gap: 14px; margin-top: 24px; }
    .btn {
      background: #4f46e5;
      color: #fff;
      border: 0;
      border-radius: 12px;
      padding: 13px 22px;
      font-weight: 600;
      outline: none;
    }
    .features {
      max-width: 980px;
      margin: 0 auto 64px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      padding: 0 24px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 14px 32px rgba(15, 23, 42, 0.08);
      text-align: center;
    }
    .icon {
      width: 44px;
      height: 44px;
      margin: 0 auto 14px;
      border-radius: 12px;
      background: #4f46e5;
      color: #fff;
      display: grid;
      place-items: center;
    }
  </style>
</head>
<body>
  <header>
    <strong>Kestrel ✨</strong>
    <span>Trusted by 10,000+ developers</span>
  </header>
  <section class="hero">
    <h1>Transform your YAML configs</h1>
    <p>Unlock next-gen reliability and empower your DevOps workflow seamlessly.</p>
    <div class="cta-group">
      <button class="btn" type="button">Get Started Free</button>
      <button class="btn" type="button">Book a Demo</button>
    </div>
  </section>
  <section class="features">
    <div class="card"><div class="icon">✨</div><h2>Smart Checks</h2><p>Effortless speed.</p></div>
    <div class="card"><div class="icon">🚀</div><h2>Blazing Fast</h2><p>Next-gen engine.</p></div>
    <div class="card"><div class="icon">🛡️</div><h2>Enterprise Safe</h2><p>Seamless trust.</p></div>
  </section>
</body>
</html>
