<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Northbeam Metrics — Before</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      padding: 28px;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 32px;
      background: linear-gradient(90deg, #4f46e5, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
    }
    .kpis {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    .card h2 { font-size: 13px; color: #64748b; }
    .card strong { font-size: 28px; display: block; margin-top: 8px; }
    .actions { display: flex; gap: 12px; margin-bottom: 20px; }
    button {
      background: #4f46e5;
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 600;
      outline: none;
    }
  </style>
</head>
<body>
  <h1>Seamless Observability</h1>
  <div class="actions">
    <button type="button">✨ Boost Performance</button>
    <button type="button">Export Insights</button>
  </div>
  <div class="kpis">
    <div class="card"><h2>Uptime</h2><strong>99.99%</strong></div>
    <div class="card"><h2>Requests</h2><strong>2.4M</strong></div>
    <div class="card"><h2>Velocity</h2><strong>3.1x</strong></div>
    <div class="card"><h2>Health Score</h2><strong>98/100</strong></div>
  </div>
  <div class="card">
    <p>Trusted by 10,000+ DevOps engineers to empower rapid scale.</p>
  </div>
</body>
</html>
