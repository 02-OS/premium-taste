version: 1
name: Premium Taste
summary: >
  Stack-agnostic judgment layer for coding agents. Principles and annotated
  references come before tokens. The goal is a specific, finished interface,
  not a shared theme.

load:
  always:
    - AGENTS.md
    - taste/index.yaml
  before_generating:
    - taste/directions.yaml
    - taste/principles.md
  before_critiquing:
    - skills/critique-ui/SKILL.md
    - taste/principles.yaml
    - taste/anti-patterns.yaml
  pick_one:
    - taste/references/index.yaml
  optional_tokens:
    - tokens/quiet-luxury.DESIGN.md
    - tokens/cinematic-dark.DESIGN.md
    - tokens/precise-technical.DESIGN.md
    - tokens/editorial-print.DESIGN.md

do_not:
  - Do not load every reference. One direction, one reference, for this screen.
  - Do not treat tokens as the taste layer. Tokens are examples of a direction already chosen.
  - Do not blend quiet-luxury, cinematic-dark, precise-technical, and editorial-print on one screen.
  - Do not cite examples/rowan-* or examples/harbor-* as real products. They are fictional demonstrations.

precedence:
  - Explicit user instruction and the product's real content.
  - The product's own DESIGN.md or brand guide, for color and type families.
  - taste/principles.yaml, for hierarchy, spacing, restraint, accessibility, and refusing generic skeletons.
  - A single reference, for structure and material, not for a costume.

status:
  principles: v1
  gallery: 18
  gallery_target: "15-25"
  directions:
    - quiet-luxury
    - cinematic-dark
    - precise-technical
    - editorial-print
